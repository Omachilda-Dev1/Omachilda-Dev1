<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Design tools: Adobe Photoshop, Adobe Illustrator, Canva, Affinity, Figma">
  <defs>
    <pattern id="mud" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M6 6 l8 8 M14 6 l-8 8" stroke="#F5E6C8" stroke-width="1.2" opacity=".08"/>
      <circle cx="30" cy="30" r="2" fill="#F5E6C8" opacity=".08"/>
    </pattern>
    <linearGradient id="canva" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00C4CC"/><stop offset=".55" stop-color="#5A32FA"/><stop offset="1" stop-color="#7D2AE8"/>
    </linearGradient>
    <linearGradient id="aff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D2F9B0"/><stop offset="1" stop-color="#9DE89A"/>
    </linearGradient>
    <style>
      .tile{animation:pop .7s cubic-bezier(.2,.9,.3,1.3) both}
      .a{animation-delay:.1s}.b{animation-delay:.3s}.c{animation-delay:.5s}.d{animation-delay:.7s}.e{animation-delay:.9s}
      @keyframes pop{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
      .float{animation:fl 4s ease-in-out infinite}
      @keyframes fl{50%{transform:translateY(-5px)}}
      .name{font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:700;fill:#F5E6C8;text-anchor:middle}
      .use{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;fill:#E8A317;text-anchor:middle;letter-spacing:1px}
      .ico{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700;text-anchor:middle}
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="#140B07"/>
  <rect width="1200" height="300" rx="18" fill="url(#mud)"/>
  <!-- Ndebele triangle frame -->
  <path d="M30 0 l15 14 l15 -14 z M90 0 l15 14 l15 -14 z M150 0 l15 14 l15 -14 z M210 0 l15 14 l15 -14 z M270 0 l15 14 l15 -14 z M330 0 l15 14 l15 -14 z M390 0 l15 14 l15 -14 z M450 0 l15 14 l15 -14 z M510 0 l15 14 l15 -14 z M570 0 l15 14 l15 -14 z M630 0 l15 14 l15 -14 z M690 0 l15 14 l15 -14 z M750 0 l15 14 l15 -14 z M810 0 l15 14 l15 -14 z M870 0 l15 14 l15 -14 z M930 0 l15 14 l15 -14 z M990 0 l15 14 l15 -14 z M1050 0 l15 14 l15 -14 z M1110 0 l15 14 l15 -14 z" fill="#C1272D"/>
  <path d="M30 300 l15 -14 l15 14 z M90 300 l15 -14 l15 14 z M150 300 l15 -14 l15 14 z M210 300 l15 -14 l15 14 z M270 300 l15 -14 l15 14 z M330 300 l15 -14 l15 14 z M390 300 l15 -14 l15 14 z M450 300 l15 -14 l15 14 z M510 300 l15 -14 l15 14 z M570 300 l15 -14 l15 14 z M630 300 l15 -14 l15 14 z M690 300 l15 -14 l15 14 z M750 300 l15 -14 l15 14 z M810 300 l15 -14 l15 14 z M870 300 l15 -14 l15 14 z M930 300 l15 -14 l15 14 z M990 300 l15 -14 l15 14 z M1050 300 l15 -14 l15 14 z M1110 300 l15 -14 l15 14 z" fill="#1E7B3A"/>

  <!-- Tile 1: Photoshop -->
  <g class="tile a"><g transform="translate(40 40)">
    <rect width="208" height="220" rx="16" fill="#1A0F0A" stroke="#E8A317" stroke-width="2"/>
    <g class="float"><rect x="62" y="24" width="84" height="84" rx="16" fill="#001E36"/>
    <text x="104" y="80" class="ico" font-size="38" fill="#31A8FF">Ps</text></g>
    <text x="104" y="150" class="name">Photoshop</text>
    <text x="104" y="176" class="use">PHOTO · COMPOSITING</text>
    <rect x="74" y="196" width="60" height="4" rx="2" fill="#31A8FF"/>
  </g></g>

  <!-- Tile 2: Illustrator -->
  <g class="tile b"><g transform="translate(264 40)">
    <rect width="208" height="220" rx="16" fill="#1A0F0A" stroke="#E8A317" stroke-width="2"/>
    <g class="float" style="animation-delay:.5s"><rect x="62" y="24" width="84" height="84" rx="16" fill="#330000"/>
    <text x="104" y="80" class="ico" font-size="38" fill="#FF9A00">Ai</text></g>
    <text x="104" y="150" class="name">Illustrator</text>
    <text x="104" y="176" class="use">VECTOR · BRANDING</text>
    <rect x="74" y="196" width="60" height="4" rx="2" fill="#FF9A00"/>
  </g></g>

  <!-- Tile 3: Canva -->
  <g class="tile c"><g transform="translate(488 40)">
    <rect width="208" height="220" rx="16" fill="#1A0F0A" stroke="#E8A317" stroke-width="2"/>
    <g class="float" style="animation-delay:1s"><circle cx="104" cy="66" r="42" fill="url(#canva)"/>
    <text x="104" y="80" class="ico" font-size="40" font-style="italic" font-family="Georgia,serif" fill="#FFF">C</text></g>
    <text x="104" y="150" class="name">Canva</text>
    <text x="104" y="176" class="use">SOCIAL · DECKS</text>
    <rect x="74" y="196" width="60" height="4" rx="2" fill="#00C4CC"/>
  </g></g>

  <!-- Tile 4: Affinity -->
  <g class="tile d"><g transform="translate(712 40)">
    <rect width="208" height="220" rx="16" fill="#1A0F0A" stroke="#E8A317" stroke-width="2"/>
    <g class="float" style="animation-delay:1.5s"><rect x="62" y="24" width="84" height="84" rx="16" fill="url(#aff)"/>
    <text x="104" y="84" class="ico" font-size="56" fill="#0F1F12">a</text></g>
    <text x="104" y="150" class="name">Affinity</text>
    <text x="104" y="176" class="use">VECTOR · PIXEL · LAYOUT</text>
    <rect x="74" y="196" width="60" height="4" rx="2" fill="#9DE89A"/>
  </g></g>

  <!-- Tile 5: Figma -->
  <g class="tile e"><g transform="translate(936 40)">
    <rect width="208" height="220" rx="16" fill="#1A0F0A" stroke="#E8A317" stroke-width="2"/>
    <g class="float" style="animation-delay:2s"><g transform="translate(76 24) scale(1.4)">
      <path d="M10 0 h10 v20 h-10 a10 10 0 0 1 0 -20z" fill="#F24E1E"/>
      <path d="M20 0 h10 a10 10 0 0 1 0 20 h-10z" fill="#FF7262"/>
      <path d="M10 20 h10 v20 h-10 a10 10 0 0 1 0 -20z" fill="#A259FF"/>
      <circle cx="30" cy="30" r="10" fill="#1ABCFE"/>
      <path d="M10 40 h10 v10 a10 10 0 1 1 -10 -10z" fill="#0ACF83"/>
    </g></g>
    <text x="104" y="150" class="name">Figma</text>
    <text x="104" y="176" class="use">UI · PROTOTYPING</text>
    <rect x="74" y="196" width="60" height="4" rx="2" fill="#A259FF"/>
  </g></g>
</svg>
