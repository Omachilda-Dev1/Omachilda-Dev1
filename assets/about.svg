<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="About Chioma: frontend engineer building fast, scalable, beautiful products across eCommerce, DeFi, EdTech, AgriTech, MedTech, FinTech, PropTech and Web3. Coding full-time since 2023, with a graphic design background.">
  <defs>
    <pattern id="mud" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M10 10 L20 20 M20 10 L10 20" stroke="#F5E6C8" stroke-width="1.4" opacity=".07"/>
      <circle cx="45" cy="15" r="2" fill="#F5E6C8" opacity=".07"/>
      <path d="M35 45 h20 M35 50 h20" stroke="#F5E6C8" stroke-width="1.2" opacity=".06"/>
    </pattern>
    <pattern id="kente" width="14" height="96" patternUnits="userSpaceOnUse">
      <rect width="14" height="96" fill="#E8A317"/>
      <rect width="14" height="10" fill="#0D0D0D"/><rect y="10" width="14" height="6" fill="#1E7B3A"/><rect y="16" width="14" height="6" fill="#C1272D"/>
      <rect x="3" y="30" width="3" height="40" fill="#0D0D0D"/><rect x="8" y="30" width="3" height="40" fill="#C1272D"/>
      <rect y="74" width="14" height="22" fill="#0D0D0D"/><rect x="3" y="77" width="6" height="6" fill="#E8A317"/><rect x="5" y="87" width="6" height="6" fill="#1E7B3A"/>
    </pattern>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#FFD36B"/><stop offset="1" stop-color="#C8553D"/>
    </linearGradient>
    <style>
      .in{animation:in .9s ease-out both}
      .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}.d5{animation-delay:1.1s}.d6{animation-delay:.4s}
      @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      .blink{animation:bl 1.1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
      .kd{animation:kd 10s linear infinite}@keyframes kd{to{transform:translateY(-96px)}}
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:Consolas,'SF Mono',Menlo,'Courier New',monospace;font-size:16px}
      .body{font-size:17px;fill:#F5E6C8}
      .k{fill:#E06C5A}.v{fill:#E8A317}.p{fill:#C8A27A}.s{fill:#7FCB86}.key{fill:#F5E6C8}.ln{fill:#5A4334}
    </style>
  </defs>

  <rect width="1200" height="540" rx="18" fill="#140B07"/>
  <rect width="1200" height="540" rx="18" fill="url(#mud)"/>
  <!-- kente side bands -->
  <svg x="0" y="0" width="14" height="540"><g class="kd"><rect width="14" height="640" fill="url(#kente)"/></g></svg>
  <svg x="1186" y="0" width="14" height="540"><g class="kd"><rect width="14" height="640" fill="url(#kente)"/></g></svg>

  <!-- LEFT: story -->
  <g class="in d1">
    <text x="50" y="84" class="serif" font-size="32" font-weight="700" fill="url(#gold)">I build fast, scalable,</text>
    <text x="50" y="122" class="serif" font-size="32" font-weight="700" fill="url(#gold)">beautiful products.</text>
  </g>
  <g class="in d2 sans body">
    <text x="50" y="166">From eCommerce storefronts and DeFi dashboards to</text>
    <text x="50" y="192">AI-powered EdTech and on-chain DApps, coding</text>
    <text x="50" y="218">full-time since <tspan fill="#E8A317" font-weight="700">2023</tspan>.</text>
  </g>

  <g class="in d3 sans" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="50" y="242" width="6" height="16" fill="#C1272D"/>
    <text x="64" y="256" text-anchor="start" font-size="13" letter-spacing="4" fill="#E8A317">SHIPPING ACROSS</text>
    <rect x="50"  y="272" width="128" height="32" rx="16" fill="#C1272D"/><text x="114" y="293" fill="#FFF">eCommerce</text>
    <rect x="188" y="272" width="128" height="32" rx="16" fill="#1E7B3A"/><text x="252" y="293" fill="#FFF">DeFi</text>
    <rect x="326" y="272" width="128" height="32" rx="16" fill="#E8A317"/><text x="390" y="293" fill="#140B07">EdTech</text>
    <rect x="464" y="272" width="128" height="32" rx="16" fill="#F5E6C8"/><text x="528" y="293" fill="#140B07">AgriTech</text>
    <rect x="50"  y="314" width="128" height="32" rx="16" fill="none" stroke="#C1272D" stroke-width="2"/><text x="114" y="335" fill="#F5E6C8">MedTech</text>
    <rect x="188" y="314" width="128" height="32" rx="16" fill="none" stroke="#1E7B3A" stroke-width="2"/><text x="252" y="335" fill="#F5E6C8">FinTech</text>
    <rect x="326" y="314" width="128" height="32" rx="16" fill="none" stroke="#E8A317" stroke-width="2"/><text x="390" y="335" fill="#F5E6C8">PropTech</text>
    <rect x="464" y="314" width="128" height="32" rx="16" fill="none" stroke="#C8553D" stroke-width="2"/><text x="528" y="335" fill="#F5E6C8">Web3</text>
  </g>

  <g class="in d4 sans body">
    <text x="50" y="388">My background in <tspan fill="#E8A317" font-weight="700">graphic design</tspan> shapes how I code.</text>
    <text x="50" y="414">I think in grids, colour and rhythm first, then make</text>
    <text x="50" y="440">the interface just as clean in the browser. I do my</text>
    <text x="50" y="466">best work on collaborative teams that turn bold ideas</text>
    <text x="50" y="492">into production-ready apps.</text>
  </g>

  <!-- RIGHT: code window -->
  <g class="in d6">
    <rect x="640" y="44" width="516" height="452" rx="14" fill="#0E0805" stroke="#E8A317" stroke-width="2"/>
    <path d="M640 86 h516" stroke="#3A2618" stroke-width="2"/>
    <circle cx="666" cy="65" r="7" fill="#C1272D"/><circle cx="690" cy="65" r="7" fill="#E8A317"/><circle cx="714" cy="65" r="7" fill="#1E7B3A"/>
    <text x="898" y="70" class="mono" font-size="13" fill="#C8A27A" text-anchor="middle">chioma.js</text>

    <g class="mono">
      <text x="684" y="122" class="ln" text-anchor="end">1</text>
      <text x="700" y="122"><tspan class="k">const</tspan> <tspan class="v">chioma</tspan> <tspan class="p">= {</tspan></text>
      <text x="684" y="150" class="ln" text-anchor="end">2</text>
      <text x="700" y="150" xml:space="preserve"><tspan class="key">  roots</tspan><tspan class="p">:    </tspan><tspan class="s">"Africa"</tspan><tspan class="p">,</tspan></text>
      <text x="684" y="178" class="ln" text-anchor="end">3</text>
      <text x="700" y="178" xml:space="preserve"><tspan class="key">  role</tspan><tspan class="p">:     </tspan><tspan class="s">"Frontend Engineer"</tspan><tspan class="p">,</tspan></text>
      <text x="684" y="206" class="ln" text-anchor="end">4</text>
      <text x="700" y="206" xml:space="preserve"><tspan class="key">  alsoDoes</tspan><tspan class="p">: [</tspan><tspan class="s">"Web3"</tspan><tspan class="p">, </tspan><tspan class="s">"UI Design"</tspan><tspan class="p">,</tspan></text>
      <text x="684" y="234" class="ln" text-anchor="end">5</text>
      <text x="700" y="234" xml:space="preserve">             <tspan class="s">"Branding"</tspan><tspan class="p">],</tspan></text>
      <text x="684" y="262" class="ln" text-anchor="end">6</text>
      <text x="700" y="262" xml:space="preserve"><tspan class="key">  stack</tspan><tspan class="p">:    [</tspan><tspan class="s">"React"</tspan><tspan class="p">, </tspan><tspan class="s">"Next.js"</tspan><tspan class="p">,</tspan></text>
      <text x="684" y="290" class="ln" text-anchor="end">7</text>
      <text x="700" y="290" xml:space="preserve">             <tspan class="s">"TypeScript"</tspan><tspan class="p">, </tspan><tspan class="s">"Node"</tspan><tspan class="p">, </tspan><tspan class="s">"Solidity"</tspan><tspan class="p">],</tspan></text>
      <text x="684" y="318" class="ln" text-anchor="end">8</text>
      <text x="700" y="318" xml:space="preserve"><tspan class="key">  design</tspan><tspan class="p">:   [</tspan><tspan class="s">"Photoshop"</tspan><tspan class="p">, </tspan><tspan class="s">"Illustrator"</tspan><tspan class="p">,</tspan></text>
      <text x="684" y="346" class="ln" text-anchor="end">9</text>
      <text x="700" y="346" xml:space="preserve">             <tspan class="s">"Canva"</tspan><tspan class="p">, </tspan><tspan class="s">"Affinity"</tspan><tspan class="p">, </tspan><tspan class="s">"Figma"</tspan><tspan class="p">],</tspan></text>
      <text x="684" y="374" class="ln" text-anchor="end">10</text>
      <text x="700" y="374" xml:space="preserve"><tspan class="key">  values</tspan><tspan class="p">:   [</tspan><tspan class="s">"Excellence"</tspan><tspan class="p">, </tspan><tspan class="s">"Integrity"</tspan><tspan class="p">,</tspan></text>
      <text x="684" y="402" class="ln" text-anchor="end">11</text>
      <text x="700" y="402" xml:space="preserve">             <tspan class="s">"Innovation"</tspan><tspan class="p">, </tspan><tspan class="s">"Growth"</tspan><tspan class="p">],</tspan></text>
      <text x="684" y="430" class="ln" text-anchor="end">12</text>
      <text x="700" y="430" xml:space="preserve"><tspan class="key">  motto</tspan><tspan class="p">:    </tspan><tspan class="s">"Ubuntu: I am because we are"</tspan><tspan class="p">,</tspan></text>
      <text x="684" y="458" class="ln" text-anchor="end">13</text>
      <text x="700" y="458" class="p">};</text>
      <rect class="blink" x="722" y="444" width="9" height="18" fill="#E8A317"/>
    </g>
  </g>
</svg>
